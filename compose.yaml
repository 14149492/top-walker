name: topwalker
services:
  db:
    image: postgres:17-bookworm
    container_name: topwalker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 30s
  backend:
    build: ./backend
    container_name: topwalker-backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3001
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      UPLOAD_DIR: /app/uploads
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3001}:3001'
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - uploads_data:/app/uploads
    networks: [app, data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  frontend:
    build: ./frontend
    container_name: topwalker-frontend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: 1
      API_INTERNAL_URL: http://backend:3001/api
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: 'true'
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
volumes:
  postgres_data:
  uploads_data:
